name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 本仓 checkout 到仓名目录（跨仓 ProjectReference 解析到同级 <dep>/ 目录）
      - uses: actions/checkout@v4
        with:
          path: aether-ai-app
      # 跨仓依赖（本地 ProjectReference 拓扑——切 PackageReference 后可移除）：
      # ai-app → aether-ai / aether-workbench / aether-ai-integrations
      - uses: actions/checkout@v4
        with:
          repository: AetherAxis/aether-ai
          path: aether-ai
      - uses: actions/checkout@v4
        with:
          repository: AetherAxis/aether-workbench
          path: aether-workbench
      - uses: actions/checkout@v4
        with:
          repository: AetherAxis/aether-ai-integrations
          path: aether-ai-integrations
      # ⑭ 的传递依赖：Aether.Ledger.AI 引 ① aether-ledger（LedgerWalletTool 用 LedgerClient /
      # LedgerWallet / LedgerAddress / LedgerSupply）。⑮ 会构建 ⑭，所以 ⑭ 的依赖链也必须在这里齐全——
      # 漏了只会在 runner 上炸成 warning MSB9008 + 一串 CS0246，本地永远看不出来（16 仓并排全解析得到）。
      - uses: actions/checkout@v4
        with:
          repository: AetherAxis/aether-ledger
          path: aether-ledger
      # 防复发：csproj 里每个 `..\..\..\<repo>\…` 都必须在同级目录存在，否则 MSB3202。
      # ⚠ 扫描范围必须包含**本仓会构建的兄弟仓**（⑭），否则正是这次那种漏检：
      # 本仓 csproj 干净、⑭ 的 csproj 引了未 checkout 的仓，断言却被判绿。
      - name: Assert cross-repo checkouts match csproj references
        shell: bash
        run: |
          missing=0
          for ref in $(grep -rhoE '(\.\.[\\/]){3}[A-Za-z0-9._-]+' aether-ai-app aether-ai-integrations --include='*.csproj' \
                       | sed -E 's/^(\.\.[\\/]){3}//' | sort -u); do
            if [ ! -d "$ref" ]; then
              echo "::error::csproj 引用了兄弟仓 '$ref'，但 CI 没有 checkout 它（见上方 checkout 列表）"
              missing=1
            fi
          done
          exit $missing
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # L1：桌面链构建（Core/App/Desktop）。src 的 Android/iOS head 需本机 workload，CI 不覆盖——
      #     移动 TFM 的构建与实跑见 README M0 记录，后续增专门 workflow。
      - name: Build
        run: dotnet build aether-ai-app/src/Aether.AI.App.Desktop/Aether.AI.App.Desktop.csproj -c Release
      # L1.5：测试（Core 引擎分段/审批/持久化往返 + VM 级集成——真实组合根全链路）
      - name: Test
        run: |
          dotnet test aether-ai-app/tests/Aether.AI.App.Core.Tests/Aether.AI.App.Core.Tests.csproj -c Release
          dotnet test aether-ai-app/tests/Aether.AI.App.Tests/Aether.AI.App.Tests.csproj -c Release
      # L2（无 GUI 等价物）：真实 DI 组合链跑规则大脑全链路 + 审批自恢复，exit 0 = 通过
      - name: Headless smoke (L2)
        run: dotnet run --project aether-ai-app/src/Aether.AI.App.Desktop -c Release -- --smoke
